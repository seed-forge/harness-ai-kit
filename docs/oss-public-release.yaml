schema_version: 1

public:
  repository: seed-forge/harness-ai-kit
  release_workflow: release.yml
  trusted_publishing: oidc

# A release is intentionally impossible until these fields identify the
# reviewed staging baseline and its committed release manifest. The baseline
# can intentionally skip private-only versions.
source_snapshot:
  source_revision: af2ac2f64b6b4032ddaac30aaa7fff1dfcde0484
  staging_manifest: docs/oss-staging-manifest.json
  staging_manifest_sha256: 66983b20255d4a96e33da5d5e6779ece0dd1f7f4947596bda854b99ef89210b1

channels:
  testpypi:
    repository_url: https://test.pypi.org
  pypi:
    repository_url: https://pypi.org

# This is an allowlist, not a discovery mechanism. New packages require an
# explicit review of their source path, version sources, tests and dependency
# order before they can be released.
packages:
  - id: harness-ai-kit
    package_name: harness-ai-kit
    source_path: .
    public: true
    ci: true
    publish: true
    release_wave: 0
    depends_on: []
    version_sources: [pyproject]
    test_command: "{python} -c \"import harness_ai_kit; print('harness-ai-kit import OK')\""
    entrypoint: harness-ai-kit
    smoke_command: "{entrypoint} --version"
    included_paths:
      - harness_ai_kit
      - cli/harness-ai-kit
      - pyproject.toml
      - README.md
      - LICENSE

  - id: sf-difyctl
    package_name: sf-difyctl
    source_path: cli/sf-difyctl
    public: true
    ci: true
    publish: true
    release_wave: 1
    depends_on: [harness-ai-kit]
    version_sources: [pyproject, cli_json, init]
    test_command: "{python} -m pytest -q tests"
    entrypoint: difyctl
    smoke_command: "{entrypoint} --help"

  - id: sf-evalctl
    package_name: sf-evalctl
    source_path: cli/sf-evalctl
    public: true
    ci: true
    publish: true
    release_wave: 1
    depends_on: [harness-ai-kit]
    version_sources: [pyproject, cli_json, init]
    test_command: "{python} -m pytest -q tests"
    entrypoint: evalctl
    smoke_command: "{entrypoint} --help"

  - id: sf-loopctl
    package_name: sf-loopctl
    source_path: cli/sf-loopctl
    public: true
    ci: true
    publish: true
    release_wave: 1
    depends_on: [harness-ai-kit]
    version_sources: [pyproject, cli_json, init]
    test_command: "{python} -m pytest -q tests"
    entrypoint: loopctl
    smoke_command: "{entrypoint} --help"

  - id: sf-mineructl
    package_name: sf-mineructl
    source_path: cli/sf-mineructl
    public: true
    ci: true
    publish: true
    release_wave: 1
    depends_on: [harness-ai-kit]
    version_sources: [pyproject, cli_json, init]
    test_command: "{python} -m pytest -q tests"
    entrypoint: mineructl
    smoke_command: "{entrypoint} --help"

  - id: sf-nexusctl
    package_name: sf-nexusctl
    source_path: cli/sf-nexusctl
    public: true
    ci: true
    publish: true
    release_wave: 1
    depends_on: [harness-ai-kit]
    version_sources: [pyproject, cli_json, init]
    test_command: "{python} -m pytest -q tests"
    entrypoint: nexusctl
    smoke_command: "{entrypoint} --help"

  - id: sf-ragflowctl
    package_name: sf-ragflowctl
    source_path: cli/sf-ragflowctl
    public: true
    ci: true
    publish: true
    release_wave: 1
    depends_on: [harness-ai-kit]
    version_sources: [pyproject, cli_json, init]
    test_command: "{python} -m pytest -q tests"
    entrypoint: ragflowctl
    smoke_command: "{entrypoint} --help"

  # Batch 8 candidates are included in CI so that packaging, tests and public
  # surface scans stay live. They cannot be published until the reviewed
  # staging commit and manifest explicitly promote them into release wave 1.
  - id: sf-jenkinsctl
    package_name: sf-jenkinsctl
    source_path: cli/sf-jenkinsctl
    public: true
    ci: true
    publish: false
    depends_on: [harness-ai-kit]
    hold_reason: "Batch 8 candidate: require reviewed staging manifest and PyPI Trusted Publisher before promotion"
    version_sources: [pyproject, cli_json, init]
    test_command: "{python} -m pytest -q tests"
    entrypoint: jenkinsctl
    smoke_command: "{entrypoint} --help"
    included_paths:
      - cli/sf-jenkinsctl

  - id: sf-woodpeckerctl
    package_name: sf-woodpeckerctl
    source_path: cli/sf-woodpeckerctl
    public: true
    ci: true
    publish: false
    depends_on: [harness-ai-kit]

schema_version: 1

public:
  repository: seed-forge/harness-ai-kit
  release_workflow: release.yml
  trusted_publishing: oidc

# A release is intentionally impossible until these fields identify the
# reviewed staging baseline and its committed release manifest. The baseline
# can intentionally skip private-only versions.
source_snapshot:
  source_revision: cd1d54b704ce8ac26fc99e72d0be9c182b7123d3
  staging_manifest: docs/oss-staging-manifest.json
  staging_manifest_sha256: 99e041c712f1721dfa27d1fead441f6d1908a4cada1f91d992c5621b7d7913d0

channels:
  testpypi:
    repository_url: https://test.pypi.org
  pypi:
    repository_url: https://pypi.org

# This is an allowlist, not a discovery mechanism. New packages require an
# explicit review of their source path, version sources, tests and dependency
# order before they can be released.
packages:
  - id: harness-ai-kit
    package_name: harness-ai-kit
    source_path: .
    public: true
    ci: true
    publish: true
    release_wave: 0
    depends_on: []
    version_sources: [pyproject]
    test_command: "{python} -c \"import harness_ai_kit; print('harness-ai-kit import OK')\""
    included_paths:
      - harness_ai_kit
      - cli/harness-ai-kit
      - pyproject.toml
      - README.md
      - LICENSE

  - id: sf-difyctl
    package_name: sf-difyctl
    source_path: cli/sf-difyctl
    public: true
    ci: true
    publish: true
    release_wave: 1
    depends_on: [harness-ai-kit]
    version_sources: [pyproject, cli_json, init]
    install_command: "{python} -m pip install ."
    test_command: "{python} -m pytest -q tests"


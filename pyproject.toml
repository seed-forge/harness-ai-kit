[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-ai-kit"
version = "0.1.0"
description = "Package manager for AI agent assets (skills / CLIs / MCPs / loops) across Codex, Claude Code, Cursor and Kiro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "SeedForge" }
]
dependencies = [
  "filelock>=3.16.1",
  "httpx>=0.27.2",
  "packaging>=24.2",
  "platformdirs>=4.3.6",
  "pydantic>=2.9.2",
  "PyYAML>=6.0.2",
  "resolvelib>=0.5.3"
]

[project.scripts]
harness-ai-kit = "harness_ai_kit.main:ai_kit_main"
ai-kit = "harness_ai_kit.main:ai_kit_main"  # short alias

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["harness_ai_kit", "harness_ai_kit.*"]

[tool.setuptools.package-data]
harness_ai_kit = ["data/*.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-difyctl"
version = "0.15.0"
description = "Dify usage-layer ops CLI: dual-track DSL import (Console API + Playwright), per-instance DSL version detect, import-ready DSL authoring/validation, provider config, resource ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "SeedForge" }
]
dependencies = [
  "harness-ai-kit>=0.2.0",
  "PyYAML>=6.0"
]

[project.urls]
Homepage = "https://github.com/seed-forge/harness-ai-kit"
Repository = "https://github.com/seed-forge/harness-ai-kit"

[project.scripts]
difyctl = "difyctl.cli:main"

[tool.setuptools.packages.find]
include = ["difyctl", "difyctl.*"]

[tool.setuptools.package-data]
difyctl = ["data/*.yaml"]

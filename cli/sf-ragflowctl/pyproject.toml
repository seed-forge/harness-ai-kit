[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-ragflowctl"
version = "0.5.1"
description = "RAGFlow ops CLI: datasets, documents, ingest, retrieval, model provider governance (v0.26 HTTP API)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "SeedForge" }
]
dependencies = [
  "harness-ai-kit>=0.2.0",
  "PyYAML>=6.0"
]

[project.urls]
Homepage = "https://github.com/seed-forge/harness-ai-kit"
Repository = "https://github.com/seed-forge/harness-ai-kit"

[project.scripts]
ragflowctl = "ragflowctl.cli:main"

[tool.setuptools.packages.find]
include = ["ragflowctl", "ragflowctl.*"]

[tool.setuptools.package-data]
ragflowctl = ["data/*.yaml"]

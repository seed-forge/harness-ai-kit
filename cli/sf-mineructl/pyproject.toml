[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-mineructl"
version = "0.1.0"
description = "MinerU document-parsing service ops CLI: doctor, probe, version, submit, status, result, tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "SeedForge" }
]
dependencies = [
  "harness-ai-kit>=0.2.0",
  "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/seed-forge/harness-ai-kit"
Repository = "https://github.com/seed-forge/harness-ai-kit"

[project.scripts]
mineructl = "mineructl.cli:main"

[tool.setuptools.packages.find]
include = ["mineructl", "mineructl.*"]

[tool.setuptools.package-data]
mineructl = ["data/*.yaml"]

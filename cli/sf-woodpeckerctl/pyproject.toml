[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-woodpeckerctl"
version = "0.4.0"
description = "woodpeckerctl: Woodpecker CI wrapper CLI — governance (audit/config) + alias routing for official woodpecker-cli."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0,<7.0",
    "harness-ai-kit>=0.18.1",
]

[project.urls]
Homepage = "https://github.com/seed-forge/harness-ai-kit"
Repository = "https://github.com/seed-forge/harness-ai-kit"

[project.scripts]
woodpeckerctl = "woodpeckerctl.cli:main"

[tool.setuptools.packages.find]
include = ["woodpeckerctl*"]

[tool.setuptools.package-data]
woodpeckerctl = ["config.defaults.yaml"]

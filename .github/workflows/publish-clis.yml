name: Publish CLIs to PyPI

# Publishes every CLI package under cli/*/ (each has its own pyproject.toml)
# to PyPI via Trusted Publishing (OIDC). New CLIs are picked up automatically —
# just add a new cli/<name>/ directory; no edits to this workflow are needed.
#
# One-time PyPI setup PER CLI package (there are no PyPI namespaces, so each
# sf-<name> package needs its own trusted publisher):
#   PyPI project (e.g. sf-loopctl) -> Settings -> Publishing -> add publisher
#   Owner: seed-forge | Repo: harness-ai-kit | Workflow: publish-clis.yml | Environment: pypi
#
# Trigger with a CLI release tag (decoupled from the core package):
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
# or run manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

jobs:
  discover:
    name: Discover CLI packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        name: Enumerate cli/*/ packages
        run: |
          pkgs=$(for d in cli/*/; do [ -f "${d}pyproject.toml" ] && basename "$d"; done \
            | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Discovered: $pkgs"

  publish:
    name: Build & publish ${{ matrix.package }}
    needs: discover
    if: ${{ needs.discover.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # OIDC trusted publishing
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build ${{ matrix.package }}
        working-directory: cli/${{ matrix.package }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish ${{ matrix.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/${{ matrix.package }}/dist/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -e . && pip install ruff pytest
      - name: Lint (syntax errors only)
        run: ruff check ai_kit/ --select=E9 || python -c "import py_compile; [py_compile.compile(f, doraise=True) for f in __import__('pathlib').Path('ai_kit').rglob('*.py')]"
      - name: Import check
        run: python -c "import ai_kit; print('import OK')"
      - name: CLI smoke test
        run: |
          ai-kit --version
          ai-kit --help
          ai-kit doctor
      - name: Validate skills
        run: |
          if [ -d skills ]; then
            find skills -name "skill.json" -exec python -m json.tool {} \; > /dev/null && echo "All skill.json valid" || exit 1
          fi

  sensitive-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan for internal references
        run: |
          set -e
          PATTERNS="askying|giteaee|nexus\.base|10\.147\.17|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\."
          FOUND=$(grep -rnE "$PATTERNS" ai_kit/ skills/ 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Internal references detected:"
            echo "$FOUND"
            exit 1
          fi
          echo "No internal references found."
      - name: Scan for secrets
        run: |
          set -e
          SECRET_PATTERNS="sk-[A-Za-z0-9]{20,}|password\s*[:=]\s*['\"][^'\"]{6,}|api[_-]?key\s*[:=]\s*['\"][^'\"]{8,}"
          FOUND=$(grep -rnEi "$SECRET_PATTERNS" ai_kit/ skills/ 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: Potential secrets detected (review manually):"
            echo "$FOUND"
          fi
          echo "Secret scan complete."

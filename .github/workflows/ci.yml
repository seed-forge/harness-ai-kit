name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . ruff pytest
      - name: Lint
        run: ruff check harness_ai_kit/ --select=E9
      - name: Core smoke tests
        run: |
          harness-ai-kit --version
          harness-ai-kit --help
          harness-ai-kit doctor
      - name: Validate skills
        run: find skills -name skill.json -exec python -m json.tool {} \; > /dev/null

  public-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install release gate dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . build twine pytest
      - name: Test release gate tools
        run: python -m unittest tools.test_public_release_gate tools.test_pypi_release_verify tools.test_public_source_policy -v
      - name: Run redaction, inventory, manifest and CLI gates
        run: |
          python -m harness_ai_kit.main validate --repo-root .
          python tools/public_release_gate.py --mode ci --report build/release-gate.json
      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-release-gate
          path: |
            build/release-gate.json
            build/public-release/
          if-no-files-found: warn
